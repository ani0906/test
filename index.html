<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羽翼下的抉擇：鏡中真相</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #050508;
      color: #e0d8d0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 主標題 Creepster / Noto Serif TC */
    .horror-title {
      font-family: 'Creepster', 'Noto Serif TC', serif;
      color: #b91c1c;
      text-shadow: 0 0 10px rgba(185, 28, 28, 0.8), 2px 2px 4px #000;
      letter-spacing: 2px;
    }

    .game-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 900px;
      max-height: 675px;
      background: #0a0a0f;
      border: 2px solid #2a1515;
      box-shadow: 0 0 50px rgba(185, 28, 28, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 驚悚氛圍遮罩 */
    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 90%);
      pointer-events: none;
      z-index: 10;
    }

    .scanline {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 11;
      opacity: 0.6;
    }

    /* 場景容器 */
    .scene {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out;
    }

    .scene.active {
      display: block;
      opacity: 1;
      pointer-events: auto;
    }

    /* 鏽湖風格左右箭頭導航 */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      font-size: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
      border-radius: 6px;
    }

    .nav-arrow:hover {
      background: rgba(185, 28, 28, 0.6);
      color: #fff;
      border-color: #b91c1c;
      box-shadow: 0 0 12px rgba(185, 28, 28, 0.8);
    }

    .nav-arrow.left { left: 15px; }
    .nav-arrow.right { right: 15px; }

    /* --- 開始畫面 --- */
    #startScene {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle, #1a0808 0%, #050505 100%);
      z-index: 15;
    }

    #startScene h1 {
      font-size: 3rem;
      margin-bottom: 40px;
    }

    .start-btn {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #991b1b;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(153, 27, 27, 0.4);
      transition: all 0.3s ease;
      z-index: 20;
      text-decoration: none;
      display: inline-block;
    }

    .start-btn:hover {
      background: #7f1d1d;
      color: #fff;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.8);
      transform: scale(1.05);
    }

    /* SVG 背景容器 */
    .svg-background {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* 發光閃爍項圈提示 */
    .glowing-collar {
      position: absolute;
      top: 45%;
      left: 49%;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(251, 191, 36, 0.4);
      border: 2px solid #fbbf24;
      box-shadow: 0 0 15px #fbbf24, inset 0 0 10px #fbbf24;
      animation: pulseGlow 1.8s infinite ease-in-out;
      cursor: pointer;
      z-index: 15;
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
        box-shadow: 0 0 8px #fbbf24;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
        box-shadow: 0 0 22px #f59e0b, 0 0 35px #d97706;
      }
    }

    /* 去背純 SVG 發光鑰匙物件 */
    .key-item-pure {
      position: absolute;
      top: 61%;
      left: 48.5%;
      width: 48px;
      height: 48px;
      cursor: pointer;
      z-index: 18;
      display: none;
      filter: drop-shadow(0 0 10px #fbbf24) drop-shadow(0 0 20px #f59e0b);
      animation: keyPulse 1.5s infinite ease-in-out;
    }

    @keyframes keyPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #fbbf24); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 18px #fef08a) drop-shadow(0 0 25px #f59e0b); }
    }

    /* --- 密碼鎖 Modal（無字純極簡風格） --- */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 8, 0.92);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 30;
    }

    .modal-overlay.active {
      display: flex;
    }

    .lock-card {
      background: #18181b;
      border: 2px solid #3f3f46;
      border-radius: 16px;
      padding: 35px 25px 25px 25px;
      width: 320px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(185, 28, 28, 0.3);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      color: #71717a;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #f87171; }

    /* 密碼滾輪排列 (對應紅、黃、藍) */
    .dials-container {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 10px;
    }

    .dial-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dial-btn {
      background: #27272a;
      border: 1px solid #52525b;
      color: #f4f4f5;
      width: 44px;
      height: 32px;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .dial-btn:hover {
      background: #3f3f46;
      color: #fff;
    }

    .dial-display {
      width: 56px;
      height: 64px;
      background: #09090b;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 2.4rem;
      font-family: 'Creepster', cursive;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      font-weight: bold;
    }

    /* 紅色框格 */
    .dial-red {
      border: 2px solid #ef4444;
      color: #ef4444;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 12px rgba(239, 68, 68, 0.4);
    }

    /* 黃色框格 */
    .dial-yellow {
      border: 2px solid #eab308;
      color: #eab308;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 12px rgba(234, 179, 8, 0.4);
    }

    /* 藍色框格 */
    .dial-blue {
      border: 2px solid #3b82f6;
      color: #3b82f6;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 12px rgba(59, 130, 246, 0.4);
    }

    /* --- 場景：鏡子與倒影 --- */
    #mirrorScene {
      background: #050505;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .mirror-frame {
      width: 280px;
      height: 380px;
      border: 12px solid #292524;
      border-radius: 140px 140px 20px 20px;
      background: radial-gradient(circle, #1c1917 0%, #0c0a09 100%);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .mirror-glass {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .owl-reflection {
      width: 220px;
      height: 220px;
      opacity: 0;
      filter: blur(4px) grayscale(40%);
      transition: opacity 2.5s ease-in-out, filter 2.5s ease-in-out;
    }

    .owl-reflection.revealed {
      opacity: 0.95;
      filter: blur(0px) drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
    }

    .crack-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0.6;
    }

    .story-text {
      max-width: 550px;
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #d4d4d8;
      min-height: 80px;
      padding: 0 20px;
    }

    .story-text span.highlight {
      color: #f59e0b;
      font-weight: bold;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="game-viewport">
    <div class="vignette"></div>
    <div class="scanline"></div>

    <!-- ===== 1. 開始畫面 (只留標題與按鈕) ===== -->
    <div id="startScene" class="scene active" style="display: flex;">
      <h1 class="horror-title">羽翼下的抉擇：鏡中真相</h1>
      <button class="start-btn" onclick="initGame()">進入荒野</button>
    </div>

    <!-- ===== 2. 左邊場景：八隻不規則散落的藍色死老鼠 ===== -->
    <div id="leftScene" class="scene">
      <div class="nav-arrow right" onclick="switchScene('mainScene')">❯</div>
      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <!-- 荒涼陰暗背景 -->
        <rect width="800" height="600" fill="#06080c"/>
        <path d="M 0 450 Q 300 420 800 480 L 800 600 L 0 600 Z" fill="#0f141d"/>
        <!-- 白芒草叢乾枯殘影 -->
        <g stroke="#1e293b" stroke-width="2" opacity="0.6">
          <path d="M 50 600 Q 70 480 120 400"/>
          <path d="M 180 600 Q 210 450 250 380"/>
          <path d="M 600 600 Q 640 460 700 390"/>
        </g>

        <!-- 8 隻藍色死老鼠散落分佈（自然且凌亂） -->
        <g id="deadRatsGroup">
          <!-- 老鼠 1：左前趴著 -->
          <g transform="translate(140, 530) rotate(68) scale(1.05)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#2563eb"/>
            <circle cx="-16" cy="-2" r="6" fill="#1d4ed8"/>
            <path d="M 18 0 Q 30 -5 35 5" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#60a5fa" font-size="8">x x</text>
          </g>
          <!-- 老鼠 2：倒掛在草叢邊 -->
          <g transform="translate(230, 470) rotate(-110) scale(0.85)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <path d="M 18 0 Q 30 5 38 -2" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#93c5fd" font-size="8">x x</text>
          </g>
          <!-- 老鼠 3：中央近景四腳朝天 -->
          <g transform="translate(310, 550) rotate(165) scale(1.15)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#2563eb"/>
            <circle cx="-16" cy="-2" r="6" fill="#1d4ed8"/>
            <path d="M 18 0 Q 25 8 32 2" stroke="#60a5fa" stroke-width="2" fill="none"/>
            <line x1="-10" y1="-8" x2="-6" y2="-15" stroke="#1e40af" stroke-width="2"/>
            <line x1="8" y1="-8" x2="12" y2="-15" stroke="#1e40af" stroke-width="2"/>
            <text x="-4" y="3" fill="#93c5fd" font-size="8">x x</text>
          </g>
          <!-- 老鼠 4：中後側臥 -->
          <g transform="translate(390, 485) rotate(-25) scale(0.9)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <path d="M 18 0 Q 30 -8 35 -1" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#60a5fa" font-size="8">x x</text>
          </g>
          <!-- 老鼠 5：中右側斜躺 -->
          <g transform="translate(480, 525) rotate(135) scale(0.95)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#2563eb"/>
            <circle cx="-16" cy="-2" r="6" fill="#1d4ed8"/>
            <path d="M 18 0 Q 28 5 36 0" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#93c5fd" font-size="8">x x</text>
          </g>
          <!-- 老鼠 6：右後小隻 -->
          <g transform="translate(580, 475) rotate(-75) scale(0.8)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <path d="M 18 0 Q 25 -10 32 -4" stroke="#60a5fa" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#60a5fa" font-size="8">x x</text>
          </g>
          <!-- 老鼠 7：右前趴躺 -->
          <g transform="translate(660, 545) rotate(15) scale(1.1)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#2563eb"/>
            <circle cx="-16" cy="-2" r="6" fill="#1d4ed8"/>
            <path d="M 18 0 Q 30 6 38 2" stroke="#3b82f6" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#93c5fd" font-size="8">x x</text>
          </g>
          <!-- 老鼠 8：最右側邊緣斜歪 -->
          <g transform="translate(730, 510) rotate(-145) scale(0.9)">
            <ellipse cx="0" cy="0" rx="20" ry="10" fill="#1d4ed8"/>
            <circle cx="-16" cy="-2" r="6" fill="#1e40af"/>
            <path d="M 18 0 Q 28 -4 34 5" stroke="#60a5fa" stroke-width="2" fill="none"/>
            <text x="-4" y="3" fill="#60a5fa" font-size="8">x x</text>
          </g>
        </g>
      </svg>
    </div>

    <!-- ===== 3. 主畫面（中間）：草叢荒野、狗雕像、縮小版紅色草鴞剪影 ===== -->
    <div id="mainScene" class="scene">
      <!-- 往左場景箭頭向左 ❮ -->
      <div class="nav-arrow left" onclick="switchScene('leftScene')">❮</div>
      <!-- 往右場景箭頭向右 ❯ -->
      <div class="nav-arrow right" onclick="switchScene('rightScene')">❯</div>

      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <defs>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#050811"/>
            <stop offset="100%" stop-color="#111827"/>
          </linearGradient>
        </defs>

        <!-- 夜空與月亮 -->
        <rect width="800" height="600" fill="url(#skyGrad)"/>
        <circle cx="680" cy="120" r="45" fill="#fef3c7" opacity="0.15"/>
        <circle cx="680" cy="120" r="35" fill="#fffbeb" opacity="0.7"/>

        <!-- 遠景山丘 -->
        <path d="M 0 420 Q 200 350 400 410 T 800 380 L 800 600 L 0 600 Z" fill="#0f172a"/>

        <!-- 背景：1 隻縮小版的紅色草鴞剪影 (神秘亮紅色線條/剪影) -->
        <g transform="translate(260, 220) scale(0.38)" opacity="0.8">
          <!-- 草鴞身體 -->
          <path d="M 100 40 C 60 40, 40 80, 40 140 C 40 200, 80 230, 100 230 C 120 230, 160 200, 160 140 C 160 80, 140 40, 100 40 Z" fill="#991b1b"/>
          <!-- 心形面盤結構 -->
          <path d="M 100 70 C 80 50, 55 70, 55 115 C 55 160, 85 185, 100 200 C 115 185, 145 160, 145 115 C 145 70, 120 50, 100 70 Z" fill="#dc2626"/>
          <!-- 雙眼發光紅點 -->
          <circle cx="78" cy="115" r="8" fill="#f87171"/>
          <circle cx="122" cy="115" r="8" fill="#f87171"/>
          <!-- 展開羽翼剪影 -->
          <path d="M 45 130 C 10 110, -40 150, -80 210 C -30 200, 20 180, 40 160 Z" fill="#7f1d1d"/>
          <path d="M 155 130 C 190 110, 240 150, 280 210 C 230 200, 180 180, 160 160 Z" fill="#7f1d1d"/>
        </g>

        <!-- 白芒草叢 (背景) -->
        <g stroke="#334155" stroke-width="2" opacity="0.7">
          <path d="M 50 600 Q 70 450 120 380 M 60 600 Q 90 440 140 370"/>
          <path d="M 200 600 Q 220 460 260 390 M 210 600 Q 240 430 290 380"/>
          <path d="M 550 600 Q 570 450 620 360 M 570 600 Q 600 440 650 370"/>
          <path d="M 700 600 Q 720 470 760 400"/>
        </g>

        <!-- 狗雕像 (完整) -->
        <g id="dogStatueFull">
          <rect x="340" y="420" width="120" height="40" fill="#334155" rx="4"/>
          <path d="M 370 420 L 370 330 Q 370 290 400 280 Q 420 280 430 310 L 430 420 Z" fill="#475569"/>
          <path d="M 380 290 Q 370 250 400 240 Q 430 250 420 290 Z" fill="#475569"/>
          <polygon points="380,260 370,220 395,250" fill="#334155"/>
          <polygon points="420,260 430,220 405,250" fill="#334155"/>
        </g>

        <!-- 狗雕像 (碎裂狀態) -->
        <g id="dogStatueBroken" style="display: none;">
          <rect x="340" y="440" width="120" height="20" fill="#1e293b" rx="2"/>
          <polygon points="350,440 370,410 390,440" fill="#334155"/>
          <polygon points="385,440 405,420 425,440" fill="#475569"/>
          <polygon points="415,440 435,405 450,440" fill="#1e293b"/>
          <polygon points="360,420 380,395 395,425" fill="#475569"/>
        </g>

        <!-- 近景白芒草 (前景) -->
        <g stroke="#64748b" stroke-width="3" opacity="0.9">
          <path d="M 10 600 Q 40 410 90 320 M 30 600 Q 80 400 130 310"/>
          <path d="M 150 600 Q 170 430 210 350"/>
          <path d="M 620 600 Q 650 420 710 310 M 650 600 Q 690 410 750 330"/>
        </g>
      </svg>

      <!-- 項圈閃爍發光點 -->
      <div id="collarGlow" class="glowing-collar" onclick="openLockModal()"></div>

      <!-- 去背純 SVG 發光鑰匙 -->
      <div id="keyItem" class="key-item-pure" onclick="collectKeyAndTransition()">
        <svg viewBox="0 0 24 24" fill="#fbbf24" width="100%" height="100%">
          <path d="M7 14C5.9 14 5 13.1 5 12C5 10.9 5.9 10 7 10C8.1 10 9 10.9 9 12C9 13.1 8.1 14 7 14ZM12.6 10C11.8 7.6 9.6 6 7 6C3.7 6 1 8.7 1 12C1 15.3 3.7 18 7 18C9.6 18 11.8 16.4 12.6 14H16V18H20V14H23V10H12.6Z"/>
        </svg>
      </div>
    </div>

    <!-- ===== 4. 右邊場景：高樓大廈與五個黃色窗口 ===== -->
    <div id="rightScene" class="scene">
      <!-- 往左回到主場景箭頭向左 ❮ -->
      <div class="nav-arrow left" onclick="switchScene('mainScene')">❮</div>
      <svg class="svg-background" viewBox="0 0 800 600" preserveAspectRatio="none">
        <rect width="800" height="600" fill="#04060a"/>
        
        <!-- 高樓大廈剪影群 -->
        <rect x="50" y="180" width="140" height="420" fill="#0b0f19"/>
        <rect x="220" y="100" width="180" height="500" fill="#111827"/>
        <rect x="440" y="220" width="130" height="380" fill="#0b0f19"/>
        <rect x="600" y="140" width="160" height="460" fill="#0f172a"/>

        <!-- 恰好 5 個黃色發光窗口 (密碼線索: 5) -->
        <g fill="#facc15" filter="drop-shadow(0 0 8px #eab308)">
          <!-- 窗口 1 -->
          <rect x="250" y="160" width="30" height="45" rx="3"/>
          <!-- 窗口 2 -->
          <rect x="330" y="160" width="30" height="45" rx="3"/>
          <!-- 窗口 3 -->
          <rect x="290" y="240" width="30" height="45" rx="3"/>
          <!-- 窗口 4 -->
          <rect x="250" y="320" width="30" height="45" rx="3"/>
          <!-- 窗口 5 -->
          <rect x="330" y="320" width="30" height="45" rx="3"/>
        </g>

        <!-- 其他熄滅的深暗窗戶 (不發光) -->
        <g fill="#1e293b" opacity="0.5">
          <rect x="80" y="220" width="25" height="35"/>
          <rect x="130" y="220" width="25" height="35"/>
          <rect x="80" y="280" width="25" height="35"/>
          <rect x="130" y="280" width="25" height="35"/>

          <rect x="470" y="270" width="25" height="35"/>
          <rect x="520" y="270" width="25" height="35"/>
          <rect x="470" y="330" width="25" height="35"/>
          <rect x="520" y="330" width="25" height="35"/>

          <rect x="630" y="200" width="25" height="35"/>
          <rect x="680" y="200" width="25" height="35"/>
          <rect x="630" y="260" width="25" height="35"/>
          <rect x="680" y="260" width="25" height="35"/>
        </g>
      </svg>
    </div>

    <!-- ===== 5. 密碼鎖 Modal（無字純極簡，紅黃藍 158） ===== -->
    <div id="lockModal" class="modal-overlay">
      <div class="lock-card">
        <button class="close-btn" onclick="closeLockModal()">&times;</button>

        <div class="dials-container">
          <!-- 紅色數字格 (對應 1 隻紅草鴞) -->
          <div class="dial-group">
            <button class="dial-btn" onclick="changeDigit(0, 1)">▲</button>
            <div id="digit0" class="dial-display dial-red">0</div>
            <button class="dial-btn" onclick="changeDigit(0, -1)">▼</button>
          </div>
          <!-- 黃色數字格 (對應 5 個黃窗口) -->
          <div class="dial-group">
            <button class="dial-btn" onclick="changeDigit(1, 1)">▲</button>
            <div id="digit1" class="dial-display dial-yellow">0</div>
            <button class="dial-btn" onclick="changeDigit(1, -1)">▼</button>
          </div>
          <!-- 藍色數字格 (對應 8 隻藍死鼠) -->
          <div class="dial-group">
            <button class="dial-btn" onclick="changeDigit(2, 1)">▲</button>
            <div id="digit2" class="dial-display dial-blue">0</div>
            <button class="dial-btn" onclick="changeDigit(2, -1)">▼</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 6. 場景：鏡子畫面（完全無字） ===== -->
    <div id="mirrorScene" class="scene">
      <div class="mirror-frame" onclick="triggerMirrorReveal()">
        <div class="mirror-glass">
          <!-- 草鴞倒影 SVG -->
          <svg id="owlSvg" class="owl-reflection" viewBox="0 0 200 200">
            <path d="M 100 30 C 60 30, 30 70, 30 110 C 30 150, 70 180, 100 180 C 130 180, 170 150, 170 110 C 170 70, 140 30, 100 30 Z" fill="#d97706" opacity="0.8"/>
            <path d="M 100 55 C 80 40, 50 60, 50 95 C 50 130, 85 155, 100 165 C 115 155, 150 130, 150 95 C 150 60, 120 40, 100 55 Z" fill="#fef3c7"/>
            <circle cx="75" cy="95" r="14" fill="#000"/>
            <circle cx="75" cy="95" r="12" fill="#b45309"/>
            <circle cx="75" cy="95" r="5" fill="#000"/>
            <circle cx="73" cy="92" r="2" fill="#fff"/>

            <circle cx="125" cy="95" r="14" fill="#000"/>
            <circle cx="125" cy="95" r="12" fill="#b45309"/>
            <circle cx="125" cy="95" r="5" fill="#000"/>
            <circle cx="123" cy="92" r="2" fill="#fff"/>

            <polygon points="100,105 94,125 106,125" fill="#78350f"/>
          </svg>

          <!-- 鏡面裂痕 overlay -->
          <svg class="crack-overlay" viewBox="0 0 200 300">
            <path d="M 20 0 L 80 120 L 140 180 M 80 120 L 40 220 M 140 180 L 190 280" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
      </div>

      <div class="story-text" id="storyText"></div>

      <!-- 公視新聞連結（替代原先重新進入輪迴按鈕） -->
      <a id="ptsNewsLink" href="https://news.pts.org.tw/article/753895" target="_blank" rel="noopener noreferrer" class="start-btn" style="display:none; margin-top: 24px; font-size: 1.05rem; padding: 12px 28px;">
        📰 閱讀公視專題：草鴞的生存危機與滅絕威脅
      </a>
    </div>

  </div>

  <script>
    // Web Audio 音效合成器
    let audioCtx = null;

    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.log('Audio init failed:', e);
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'unlock') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'shatter') {
          const bufferSize = audioCtx.sampleRate * 0.4;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const noiseFilter = audioCtx.createBiquadFilter();
          noiseFilter.type = 'highpass';
          noiseFilter.frequency.value = 1000;
          
          noise.connect(noiseFilter);
          noiseFilter.connect(gain);
          gain.gain.setValueAtTime(0.6, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          noise.start(now);
        } else if (type === 'eerie') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 2.0);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 2.0);
          osc.start(now);
          osc.stop(now + 2.0);
        }
      } catch (e) {
        console.log('Audio playback skipped:', e);
      }
    }

    // 遊戲狀態與密碼設定
    const digits = [0, 0, 0];
    const targetCode = [1, 5, 8]; // 1隻紅草鴞, 5個黃窗口, 8隻藍死鼠
    let isUnlocked = false;
    let isKeyCollected = false;

    function switchScene(targetId, displayType = 'block') {
      const scenes = document.querySelectorAll('.scene');
      scenes.forEach(s => {
        s.style.display = 'none';
        s.classList.remove('active');
      });

      const target = document.getElementById(targetId);
      if (target) {
        target.style.display = displayType;
        target.classList.add('active');
      }
    }

    function initGame() {
      switchScene('mainScene', 'block');
      try {
        initAudio();
        playSound('click');
      } catch(e){}
    }

    function openLockModal() {
      if (isUnlocked) return;
      try { playSound('click'); } catch(e){}
      const modal = document.getElementById('lockModal');
      if (modal) modal.style.display = 'flex';
    }

    function closeLockModal() {
      try { playSound('click'); } catch(e){}
      const modal = document.getElementById('lockModal');
      if (modal) modal.style.display = 'none';
    }

    function changeDigit(index, delta) {
      try { playSound('click'); } catch(e){}
      digits[index] = (digits[index] + delta + 10) % 10;
      document.getElementById(`digit${index}`).innerText = digits[index];
      checkLockCode();
    }

    function checkLockCode() {
      if (digits[0] === targetCode[0] && digits[1] === targetCode[1] && digits[2] === targetCode[2]) {
        isUnlocked = true;
        try { playSound('unlock'); } catch(e){}

        setTimeout(() => {
          closeLockModal();
          triggerStatueShatter();
        }, 600);
      }
    }

    function triggerStatueShatter() {
      try { playSound('shatter'); } catch(e){}
      document.getElementById('collarGlow').style.display = 'none';
      document.getElementById('dogStatueFull').style.display = 'none';
      document.getElementById('dogStatueBroken').style.display = 'block';
      document.getElementById('keyItem').style.display = 'block';
    }

    function collectKeyAndTransition() {
      if (isKeyCollected) return;
      isKeyCollected = true;
      try { playSound('click'); } catch(e){}
      document.getElementById('keyItem').style.display = 'none';

      // 直接切換至鏡子畫面，去除動畫過渡
      switchScene('mirrorScene', 'flex');
      try { playSound('eerie'); } catch(e){}
    }

    function triggerMirrorReveal() {
      try { playSound('eerie'); } catch(e){}
      const owlSvg = document.getElementById('owlSvg');
      if (owlSvg) owlSvg.classList.add('revealed');

      document.getElementById('storyText').innerHTML = `
        鏡子裡映照出的，不是人類的模樣...<br><br>
        而是一隻帶有心形面具、眼神深邃無奈的<span class="highlight">草鴞</span>。<br>
        全台僅存約 <span class="highlight">158 對</span> 繁衍個體，你正是其中之一。
      `;

      // 顯示公視新聞連結按鈕
      document.getElementById('ptsNewsLink').style.display = 'inline-block';
    }
  </script>
